# Copy to this plugin's data folder. Restart or reload the plugin to apply.
# These are the defaults; delete a line to keep its default. See README.md.
# Seconds. Expiry 0..300 (0 = off), delay 0..30, cooldown 0..3600, protection 0..60.
expiry_seconds=60
delay_seconds=3
cooldown_seconds=30
arrival_protection_seconds=0
# Requests waiting on one player, and out from one player: 1..16.
max_pending=5
partial_names=false
buttons=true
toggle_subcommand=true
safe_teleport=true
# Blocks to look around for a safe spot: 0..4.
safe_search_radius=3
water_safe=false
safe_skip_modes=creative,spectator
center_on_block=true
dismount=true
