[package]
name = "tpa-lite"
version = "0.1.0"
edition = "2024"
description = "First-party teleport requests for Strawberry."
authors = ["Strawberry Interactive LLC"]
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sp-social = { path = "libs/sp-social" }
strawberry-plugin-api = { version = "=0.2.3", registry = "strawberry" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/sp-social"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
